  <circle cx="230" cy="150" r="118" fill="none" stroke="#3a2c24" stroke-width="1.6"/>
  <text x="142.02" y="100.4" transform="rotate(-60.59 142.02 100.4)" text-anchor="middle" font-family="Martian Mono" font-weight="500" font-size="15" fill="#3a2c24">B</text>
  <text x="149.32" y="89.23" transform="rotate(-53.01 149.32 89.23)" text-anchor="middle" font-family="Martian Mono" font-weight="500" font-size="15" fill="#3a2c24">R</text>
  <text x="158.04" y="79.13" transform="rotate(-45.44 158.04 79.13)" text-anchor="middle" font-family="Martian Mono" font-weight="500" font-size="15" fill="#3a2c24">E</text>
