<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <title>Brew and the City — The Stamp (Figma-safe, no textPath)</title>
  <!-- Identical to B-the-stamp.svg, except the arched lettering is placed
       glyph by glyph instead of riding a textPath. Figma's SVG importer
       handles textPath poorly, so this version survives the round trip.
       Positions were measured against the real Martian Mono at 15px with
       2.85px tracking on a 101px radius, not estimated. -->
