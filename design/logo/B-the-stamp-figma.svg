  <text x="216.69" y="49.88" transform="rotate(-7.57 216.69 49.88)" text-anchor="middle" font-family="Martian Mono" font-weight="500" font-size="15" fill="#3a2c24">D</text>
  <text x="243.31" y="49.88" transform="rotate(7.57 243.31 49.88)" text-anchor="middle" font-family="Martian Mono" font-weight="500" font-size="15" fill="#3a2c24">T</text>
  <text x="256.39" y="52.51" transform="rotate(15.15 256.39 52.51)" text-anchor="middle" font-family="Martian Mono" font-weight="500" font-size="15" fill="#3a2c24">H</text>
  <text x="269.01" y="56.84" transform="rotate(22.72 269.01 56.84)" text-anchor="middle" font-family="Martian Mono" font-weight="500" font-size="15" fill="#3a2c24">E</text>
